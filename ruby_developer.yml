---
- name: Configure ruby developer workstation
  hosts: localhost
  gather_facts: true
  become: true

  vars_files:
    - vars/global_vars.yml

  pre_tasks:
    - name: Get current username
      become: false
      ansible.builtin.command: id -un
      register: current_user
      changed_when: false

    - name: Set ansible_user fact
      ansible.builtin.set_fact:
        ansible_user: "{{ current_user.stdout }}"

    - name: Debug ansible_user
      ansible.builtin.debug:
        msg: "Current user: {{ ansible_user }}"

    - name: Ensure git and zsh are installed
      ansible.builtin.package:
        name:
          - git
          - zsh
        state: present

    - name: Ensure .zshrc exists for ruby developer user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.zshrc"
        state: touch
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0644"
  roles:
    - ruby_developer
